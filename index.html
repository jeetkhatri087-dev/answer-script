<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studyio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e2a54">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studyio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* ---- theme: chalkboard (default light, auto-dark) ---- */
  html[data-theme="chalkboard"]{
    --font-display:"Newsreader",Georgia,serif; --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --bg:#f5f1e4; --bg-line:#ded2b1;
    --ink:#223349; --ink-soft:#51637a;
    --accent:#1f4235; --accent-deep:#153123; --accent-text:#eef1ea;
    --mark:#ab301c; --mark-soft:#c96654; --mark-wash:#f5e2dd;
    --gold:#8a611a; --gold-wash:#f1e6cb;
    --surface:#fffdf6; --surface-2:#fbf6e8;
    --border:#dcd0a9; --shadow:rgba(34,51,73,0.10);
    --focus:#3b6ea5; --ok:#2f6b3a; --ok-wash:#e3ecdf;
    --nav-bg:var(--accent); --nav-text:var(--accent-text);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="chalkboard"]{
      --bg:#152019; --bg-line:#233427;
      --ink:#eae4d2; --ink-soft:#b7c0b2;
      --accent:#0e1e16; --accent-deep:#0a1610; --accent-text:#eae4d2;
      --mark:#e07a5f; --mark-soft:#b8503b; --mark-wash:#3a2420;
      --gold:#d8b25e; --gold-wash:#3a3120;
      --surface:#1b2a21; --surface-2:#17231c;
      --border:#2c4032; --shadow:rgba(0,0,0,0.4);
      --focus:#7fa8d9; --ok:#8fbf8f; --ok-wash:#203122;
      --nav-bg:var(--accent); --nav-text:var(--accent-text);
      color-scheme: dark;
    }
  }
  /* ---- theme: enchanted academy (original candlelit/parchment look, default) ---- */
  html[data-theme="enchanted"]{
    --font-display:"Cinzel",Georgia,serif; --font-body:"EB Garamond",Georgia,serif;
    --bg:#221a12; --bg-line:#2f2417;
    --ink:#ecdfc0; --ink-soft:#c3b083;
    --accent:#4a1620; --accent-deep:#330e16; --accent-text:#f1e2bd;
    --mark:#c9a227; --mark-soft:#8f7220; --mark-wash:#3a2f18;
    --gold:#c9a227; --gold-wash:#3a2f18;
    --surface:#2b2116; --surface-2:#241b11;
    --border:#4a3c26; --shadow:rgba(0,0,0,0.5);
    --focus:#7fa8d9; --ok:#7fae6f; --ok-wash:#22301c;
    --nav-bg:var(--accent); --nav-text:var(--accent-text);
    color-scheme: dark;
  }
  /* ---- theme: chatbot light (clean, minimal, default) ---- */
  html[data-theme="chatbot"]{
    --font-display:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --bg:#ffffff; --bg-line:#ececef;
    --ink:#111318; --ink-soft:#6b7280;
    --accent:#28365e; --accent-deep:#1b2745; --accent-text:#eef1f8;
    --mark:#dc2626; --mark-soft:#f0a6a6; --mark-wash:#fef2f2;
    --gold:#b45309; --gold-wash:#fef3e2;
    --surface:#ffffff; --surface-2:#f5f6f8;
    --border:#e5e7eb; --shadow:rgba(17,19,24,0.06);
    --focus:#7fa1cc; --ok:#16a34a; --ok-wash:#f0fdf4;
    --nav-bg:var(--accent); --nav-text:var(--accent-text);
    color-scheme: light;
  }
  /* ---- theme: six gems (original — inspired by colorful mystical gems,
     not any specific film/comic branding: no character names, logos or
     insignia, just a starfield backdrop and a six-colour accent motif) ---- */
  html[data-theme="gems"]{
    --font-display:"Cinzel",Georgia,serif; --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --bg:#0d0b1a; --bg-line:#1c1730;
    --ink:#f0eefc; --ink-soft:#b6afd6;
    --accent:#7c3aed; --accent-deep:#5b21b6; --accent-text:#ffffff;
    --mark:#ef4444; --mark-soft:#f8817a; --mark-wash:#2a1414;
    --gold:#eab308; --gold-wash:#2a2410;
    --surface:#161129; --surface-2:#1f1938;
    --border:#332a56; --shadow:rgba(0,0,0,0.45);
    --focus:#38bdf8; --ok:#22c55e; --ok-wash:#132a1c;
    --nav-bg:var(--accent); --nav-text:var(--accent-text);
    color-scheme: dark;
  }
  .gems-bar{ display:none; height:4px; border-radius:999px; margin:2px 10px 10px;
    background:linear-gradient(90deg,#7c3aed,#38bdf8,#22c55e,#eab308,#f97316,#ef4444); }
  html[data-theme="gems"] .gems-bar{ display:block; }
  /* ---- theme: custom colour (fixed light layout; --accent/--accent-deep/
     --accent-text/--focus/--bg/--surface/--surface-2/--bg-line/--border get
     overridden inline via JS based on the user's chosen colour — see
     applyCustomAccent(). --nav-bg/--nav-text are NOT overridden by JS: the
     side menu stays a calm fixed dark blue no matter how bright the picked
     colour is, so a vivid pick never turns the whole menu garish. ---- */
  html[data-theme="custom"]{
    --font-display:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --bg:#f7f7f8; --bg-line:#e9e9ee;
    --ink:#16181d; --ink-soft:#6b7280;
    --accent:#2563eb; --accent-deep:#1d4ed8; --accent-text:#ffffff;
    --mark:#dc2626; --mark-soft:#f0a6a6; --mark-wash:#fef2f2;
    --gold:#b45309; --gold-wash:#fef3e2;
    --surface:#ffffff; --surface-2:#f0f1f4;
    --border:#e2e3e8; --shadow:rgba(17,19,24,0.06);
    --focus:#2563eb; --ok:#16a34a; --ok-wash:#f0fdf4;
    --nav-bg:#1e2a54; --nav-text:#eef1f8;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
  }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; color:var(--ink); }
  html[data-theme="enchanted"] h1, html[data-theme="enchanted"] h2, html[data-theme="enchanted"] h3{ letter-spacing:.02em; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  a{ color:var(--focus) }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .app{ min-height:100vh; }
  .topbar{
    position:sticky; top:0; z-index:15; display:flex; align-items:center; gap:12px;
    padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .hamburger{
    background:none; border:none; color:var(--ink); font-size:22px; line-height:1; cursor:pointer;
    padding:4px 9px; border-radius:8px; flex-shrink:0;
  }
  .hamburger:hover{ background:var(--surface-2); }
  .topbar-avatar{
    width:28px; height:28px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;
    flex-shrink:0; background:var(--accent);
  }

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;
    opacity:0; visibility:hidden; transition:opacity .2s ease;
  }
  .drawer-backdrop.open{ opacity:1; visibility:visible; }

  .nav{
    width:250px; max-width:82vw; background:var(--nav-bg); color:var(--nav-text);
    display:flex; flex-direction:column; gap:2px; padding:20px 12px;
    position:fixed; top:0; left:0; height:100vh; overflow-y:auto; z-index:30;
    transform:translateX(-100%); transition:transform .22s ease;
  }
  .nav.open{ transform:translateX(0); }
  .brand{ padding:10px 10px 4px; display:flex; align-items:center; gap:6px; }
  .nav-close{ background:none; border:none; color:var(--nav-text); opacity:.7; font-size:20px; cursor:pointer; padding:2px 6px; border-radius:6px; flex-shrink:0; }
  .nav-close:hover{ opacity:1; background:rgba(238,241,234,0.12); }
  .navbtn{
    display:flex; align-items:center; gap:10px; text-align:left; width:100%;
    background:transparent; border:none; color:var(--nav-text); opacity:.78;
    padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer;
  }
  .navbtn .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; flex-shrink:0; }
  .navbtn:hover{ background:rgba(238,241,234,0.08); opacity:1; }
  .navbtn.active{ background:rgba(238,241,234,0.14); opacity:1; font-weight:600; }
  .navbtn.disabled{ opacity:.4; }
  .nav-spacer{ flex:1; }
  .nav-divider{ height:1px; background:rgba(238,241,234,.18); margin:6px 10px 8px; flex-shrink:0; }
  .nav-footer{ padding:12px 12px 4px; font-size:11.5px; opacity:.55; line-height:1.5; }
  .profile-card-wrap{ flex:1; min-width:0; }
  .profile-card{
    display:flex; align-items:center; gap:10px; width:100%; background:rgba(238,241,234,.07);
    border:1px solid rgba(238,241,234,.14); border-radius:12px; padding:9px 10px; cursor:pointer; text-align:left;
    color:var(--nav-text);
  }
  .profile-card:hover{ background:rgba(238,241,234,.13); }
  .profile-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:#fff;
  }
  .profile-card-text{ flex:1; min-width:0; }
  .profile-card-name{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile-card-sub{ font-size:11px; opacity:.65; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile-card-chevron{ font-size:10px; opacity:.6; transition:transform .15s; flex-shrink:0; }
  .profile-card-chevron.open{ transform:rotate(180deg); }
  .profile-switcher{ background:rgba(0,0,0,.15); border-radius:10px; margin:4px 10px 10px; padding:6px; }
  .profile-row{
    display:flex; align-items:center; gap:9px; width:100%; background:transparent; border:none; border-radius:8px;
    padding:7px 8px; cursor:pointer; color:var(--nav-text); text-align:left; font-size:13px;
  }
  .profile-row:hover{ background:rgba(238,241,234,.1); }
  .profile-row.active{ background:rgba(238,241,234,.16); font-weight:600; }
  .profile-row .profile-avatar{ width:24px; height:24px; font-size:10.5px; }
  .profile-row span{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile-row-del{ margin-left:auto; opacity:.5; font-size:15px; background:none; border:none; color:var(--nav-text); cursor:pointer; padding:2px 6px; flex-shrink:0; }
  .profile-row-del:hover{ opacity:1; }
  .profile-add-row{ display:flex; gap:6px; padding:7px 4px 2px; }
  .profile-add-row input{
    flex:1; min-width:0; background:rgba(238,241,234,.08); border:1px solid rgba(238,241,234,.2); border-radius:6px;
    padding:7px 9px; font-size:12.5px; color:var(--nav-text);
  }
  .profile-add-row input::placeholder{ color:rgba(238,241,234,.5); }

  main{ padding:28px clamp(16px,4vw,44px) 60px; }
  .page-head{ margin-bottom:22px; }
  .page-head .eyebrow{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .page-head h2{ font-size:26px; margin-top:4px; }
  .page-head p{ color:var(--ink-soft); margin-top:6px; max-width:62ch; font-size:14px; }
  .page-head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .icon-btn{ flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background:var(--gold-wash); border-color:var(--gold); color:var(--gold); }
  .onboard-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px 0; }
  .onboard-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; max-width:560px; width:100%; }
  .onboard-card .eyebrow{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .onboard-card h2{ font-size:24px; margin-top:4px; }
  .section-h{ font-size:17px; margin-bottom:12px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px; box-shadow:0 1px 2px var(--shadow); cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:8px; width:100%; color:var(--ink);
  }
  .card:hover{ border-color:var(--focus); }
  .card h3{ font-size:16.5px; font-weight:600; }
  .card .meta{ display:flex; gap:14px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; }
  .card .meta b{ color:var(--ink); font-family:"IBM Plex Mono",monospace; }
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 9px;
    border-radius:999px; background:var(--gold-wash); color:var(--gold); font-weight:600; width:fit-content;
  }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em; }
  select, input[type=text], input[type=number], input[type=password], textarea{
    width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--border);
    border-radius:8px; padding:9px 11px; font-family:var(--font-body); font-size:14px;
  }
  textarea{ resize:vertical; min-height:90px; font-family:var(--font-body); }
  .field{ margin-bottom:16px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:150px; }

  .btn{
    background:var(--accent); color:var(--accent-text); border:none; border-radius:8px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn:hover{ background:var(--accent-deep); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--border); }
  .btn.secondary:hover{ border-color:var(--focus); }
  .btn.danger{ background:transparent; color:var(--mark); border:1px solid var(--mark-soft); }
  .btn.small{ padding:6px 12px; font-size:12.5px; }
  .linkbtn{ background:none; border:none; color:var(--focus); cursor:pointer; font-size:13px; padding:0; text-decoration:underline; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }

  .chapters-box{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chapter-chip{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; user-select:none; }
  .chapter-chip input{ accent-color:var(--accent); margin:0; }
  .chapter-chip.checked{ border-color:var(--gold); background:var(--gold-wash); }
  .chaptools{ display:flex; gap:12px; margin-top:6px; margin-bottom:14px; }
  .chip-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .chip-dot-pending{ background:var(--gold); }
  .chip-dot-covered{ background:var(--focus); }
  .chip-dot-revised{ background:var(--ok); }
  .chip-dot-mastered{ background:var(--accent); }
  .chapter-group{ border:1px solid var(--border); border-radius:10px; margin-bottom:10px; background:var(--surface); overflow:hidden; flex:1 1 100%; }
  .chapter-group summary{ cursor:pointer; list-style:none; padding:10px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .chapter-group summary::-webkit-details-marker{ display:none; }
  .chapter-group summary::before{ content:"\25B8"; font-size:11px; color:var(--ink-soft); display:inline-block; transition:transform .15s; }
  .chapter-group[open] summary::before{ transform:rotate(90deg); }
  .chapter-group-count{ margin-left:auto; font-size:11px; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:1px 8px; }
  .chapter-group-body{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 14px 14px; }

  .home-hero{ padding:30px 2px 26px; }
  .home-greeting{ font-family:var(--font-display); font-size:28px; font-weight:600; color:var(--ink); }
  .home-quote{ margin-top:10px; font-style:italic; color:var(--ink-soft); font-size:15px; max-width:54ch; }
  .home-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .home-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px;
    text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px; color:var(--ink);
    box-shadow:0 1px 2px var(--shadow); transition:border-color .15s, transform .15s; width:100%;
  }
  .home-tile:hover{ border-color:var(--focus); transform:translateY(-2px); }
  .home-tile-icon{ font-size:22px; }
  .home-tile-title{ font-weight:600; font-size:15px; font-family:var(--font-body); }
  .home-tile-desc{ font-size:12.5px; color:var(--ink-soft); }
  .home-snapshot{ font-size:12.5px; color:var(--ink-soft); padding-top:2px; }
  .chat-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .chat-messages{ display:flex; flex-direction:column; gap:10px; max-height:48vh; min-height:20px; overflow-y:auto; padding:2px 2px 4px; }
  .chat-msg{ max-width:88%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--accent); color:var(--accent-text); border-bottom-right-radius:4px; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-msg.thinking{ font-style:italic; opacity:.7; }
  .chat-input-row{ display:flex; gap:8px; align-items:flex-end; margin-top:10px; }
  .chat-input-row textarea{
    flex:1; min-height:42px; max-height:120px; resize:none; font-family:var(--font-body);
    background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px;
  }

  .diff-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .diff-opt{ flex:1; min-width:120px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:12.5px; text-align:center; background:var(--surface-2); }
  .diff-opt.checked{ border-color:var(--gold); background:var(--gold-wash); color:var(--gold); font-weight:600; }
  .diff-opt input{ display:none; }

  .paper-sheet{
    position:relative; overflow:hidden;
    background: linear-gradient(var(--bg-line) 1px, transparent 1px);
    background-size: 100% 28px; background-color:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:22px 20px 26px; margin-top:16px;
  }
  .paper-sheet .watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-30deg);
    font-family:var(--font-display); font-size:42px; font-weight:700; color:var(--ink);
    opacity:0.055; white-space:nowrap; letter-spacing:3px; pointer-events:none; z-index:0; user-select:none;
  }
  .paper-sheet .head{ position:relative; z-index:1; border:1.5px solid var(--ink); border-radius:6px; padding:12px 14px; margin-bottom:16px; background:var(--surface); }
  .paper-sheet .head .subj{ font-family:var(--font-display); font-size:19px; font-weight:600; }

  function hexToRgb(hex){

    if(isNaN(n)) return {r:37,g:99,b:235};

          if(!resp || resp.error || !resp.access_token){
            googleSignInBusy = false;
            googleSignInError = resp && resp.error ? ("Google sign-in was cancelled or blocked (" + resp.error + ").") : "Google sign-in didn't return a token.";
            render(); return;
          }
          try{
            var key = await provisionGeminiKey(resp.access_token, function(msg){ googleSignInStatus = msg; render(); });
            state.apiKey = key;
            state.model = state.model || "gemini-3.6-flash";
            saveState();
            googleSignInBusy = false; googleSignInStatus = "Done — your own free API key is set up and saved.";
            render();
          }catch(e){
            googleSignInBusy = false;
            googleSignInError = e && e.message ? e.message : "Something went wrong setting up your key.";
            render();
          }
        }
      });
      tokenClient.requestAccessToken();
    }catch(e){
      googleSignInBusy = false;
      googleSignInError = "Couldn't start Google sign-in: " + (e && e.message ? e.message : e);
      render();
    }
  }

  // Polls a long-running Google Cloud "Operation" until it's done.
  function pollGcpOperation(apiBase, opName, accessToken){
    return new Promise(function(resolve, reject){
      var attempts = 0;
      var check = function(){
        attempts++;
        fetch(apiBase + "/" + opName, { headers: { Authorization: "Bearer " + accessToken } })
          .then(function(res){ return res.json().then(function(json){ return {res:res, json:json}; }); })
          .then(function(r){
            if(!r.res.ok){ reject(new Error(humanizeGcpError(r.json))); return; }
            if(r.json.done){
              if(r.json.error){ reject(new Error(r.json.error.message || "Google Cloud reported an error finishing the operation.")); return; }
              resolve(r.json);
            }else if(attempts >= 25){
              reject(new Error("Google Cloud is taking a long time to finish setting up your project. Try again in a minute."));
            }else{
              setTimeout(check, 1500);
            }
          })
          .catch(function(e){ reject(new Error("Network error while checking Google Cloud: " + e.message)); });
      };
      check();
    });
  }

  function humanizeGcpError(json){
    var msg = (json && json.error && json.error.message) || "Something went wrong talking to Google Cloud.";
    var lower = msg.toLowerCase();
    if(lower.indexOf("quota")!==-1 || lower.indexOf("maximum number of projects")!==-1){
      return "This Google account has hit its free project limit, so a new one couldn't be created. Try a different Google account, or use the manual API key option below.";
    }
    if(lower.indexOf("permission")!==-1 || lower.indexOf("forbidden")!==-1 || lower.indexOf("policy")!==-1 || lower.indexOf("not authorized")!==-1){
      return "This Google account isn't allowed to create cloud projects (common on school/managed accounts). Try a personal Gmail account, or use the manual API key option below.";
    }
    if(lower.indexOf("has not been used")!==-1 || lower.indexOf("disabled")!==-1){
      return "Google is still turning on a required service. Wait about 30 seconds and try again.";
    }
    if(lower.indexOf("not been granted")!==-1 || lower.indexOf("access_denied")!==-1 || lower.indexOf("unverified")!==-1){
      return "Google blocked this because the app isn't verified and this account isn't on the test-user list yet. Ask whoever set up this app to add your Google email as a test user (SETUP.md).";
    }
    return msg + " If this keeps happening, use the manual API key option below instead.";
  }

  // Creates a brand-new Google Cloud project on the signed-in person's
  // account, turns on the Gemini API in it, and mints an API key restricted
  // to that API — then returns the key string. `onStatus` is called with
  // short progress messages to show in the UI.
  async function provisionGeminiKey(accessToken, onStatus){
    var authHeaders = { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" };
    var projectId = "studyio-" + Math.random().toString(36).slice(2, 10);

    onStatus("Creating your own Google Cloud project…");
    var createRes = await fetch("https://cloudresourcemanager.googleapis.com/v3/projects", {
      method: "POST", headers: authHeaders,
      body: JSON.stringify({ projectId: projectId, displayName: "Studyio" })
    });
    var createJson = await createRes.json();
    if(!createRes.ok) throw new Error(humanizeGcpError(createJson));
    await pollGcpOperation("https://cloudresourcemanager.googleapis.com/v3", createJson.name, accessToken);

    onStatus("Turning on the Gemini API for your project…");
    var enableRes = await fetch("https://serviceusage.googleapis.com/v1/projects/" + projectId + "/services/generativelanguage.googleapis.com:enable", {
      method: "POST", headers: authHeaders
    });
    var enableJson = await enableRes.json();
    if(!enableRes.ok) throw new Error(humanizeGcpError(enableJson));
    if(enableJson.name && !enableJson.done){
      await pollGcpOperation("https://serviceusage.googleapis.com/v1", enableJson.name, accessToken);
    }

    onStatus("Creating your free API key…");
    var keyRes = await fetch("https://apikeys.googleapis.com/v2/projects/" + projectId + "/locations/global/keys", {
      method: "POST", headers: authHeaders,
      body: JSON.stringify({ displayName: "Studyio key", restrictions: { apiTargets: [{ service: "generativelanguage.googleapis.com" }] } })
    });
    var keyOpJson = await keyRes.json();
    if(!keyRes.ok) throw new Error(humanizeGcpError(keyOpJson));
    var keyOpResult = await pollGcpOperation("https://apikeys.googleapis.com/v2", keyOpJson.name, accessToken);
    var keyResourceName = keyOpResult.response && keyOpResult.response.name;
    if(!keyResourceName) throw new Error("Google Cloud didn't return the new key's location.");

    onStatus("Fetching your key…");
    var getKeyRes = await fetch("https://apikeys.googleapis.com/v2/" + keyResourceName + "/keyString", {
      headers: { Authorization: "Bearer " + accessToken }
    });
    var getKeyJson = await getKeyRes.json();
    if(!getKeyRes.ok) throw new Error(humanizeGcpError(getKeyJson));
    if(!getKeyJson.keyString) throw new Error("Google Cloud didn't return the key text.");
    return getKeyJson.keyString;
  }

  // ---------- persistence ----------
  function normalizeState(s){
    if(!s.subjects) s.subjects = {};
    if(!s.materials) s.materials = [];
    if(!s.papers) s.papers = [];
    if(!s.results) s.results = [];
    if(!s.model || RETIRED_MODELS.indexOf(s.model)!==-1) s.model = "gemini-3.6-flash";
    if(!s.theme) s.theme = "chatbot";
    if(!s._themeMigratedV1){ s.theme = "chalkboard"; s._themeMigratedV1 = true; } // one-time: new default was Chalkboard
    if(!s._themeMigratedV2){ if(s.theme==="chalkboard") s.theme = "chatbot"; s._themeMigratedV2 = true; } // one-time: new default is Chatbot Light
    if(THEMES.map(function(t){return t[0];}).indexOf(s.theme)===-1) s.theme = "chatbot"; // guard against a removed/unknown theme value
    if(!s.customAccent) s.customAccent = CUSTOM_ACCENT_PRESETS[0];
    if(!s.timetable) s.timetable = {};
    DAYS.forEach(function(d){ if(!s.timetable[d[0]]) s.timetable[d[0]] = []; });
    if(!s.examDates) s.examDates = {};
    if(!s.dailyLogs) s.dailyLogs = [];
    if(!s.studyPlan) s.studyPlan = null;
    if(!s.chatHistory) s.chatHistory = [];
    if(!s.profile) s.profile = { name:"", dob:"", grade:"", email:"", phone:"", gender:"", school:"", city:"" };
    Object.keys(s.subjects).forEach(function(k){
      if(!s.subjects[k].chapters) s.subjects[k].chapters = [];
      if(!s.subjects[k].chapterStatus) s.subjects[k].chapterStatus = {};
      if(s.subjects[k].textbook===undefined) s.subjects[k].textbook = "";
      // If this subject now has a known textbook edition but the account
      // hasn't picked one yet, default to the first one — either because the
      // subject has no chapters at all yet, or because its chapters are
      // still exactly the old short placeholder list this subject used to
      // ship with before real textbook chapter lists were added (so a
      // genuinely user-edited chapter list is never overwritten).
      var tbOpts = TEXTBOOKS[k];
      if(tbOpts && tbOpts.length && !s.subjects[k].textbook){
        var cur = s.subjects[k].chapters;
        var seed = CHAPTER_SEED[k] || [];
        var isEmpty = !cur.length;
        var isUntouchedSeed = cur.length && cur.length===seed.length && cur.every(function(c,i){ return c===seed[i]; });
        if(isEmpty || isUntouchedSeed){
          s.subjects[k].textbook = tbOpts[0].name;
          s.subjects[k].chapters = tbOpts[0].chapters.slice();
        }
      }
    });
    return s;
  }
  function loadState(){

    var s = raw ? JSON.parse(raw) : null;

  function esc(s){

    });

  function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }catch(e){ return ""; } }

  function fileToBase64(file){
    return new Promise(function(resolve,reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result).split(",")[1]); };
      r.onerror = reject; r.readAsDataURL(file);
    });
  }
  function makeThumbnail(file){
    return new Promise(function(resolve){
      if(!file.type || file.type.indexOf("image/")!==0){ resolve(null); return; }
      var img = new Image(); var url = URL.createObjectURL(file);
      img.onload = function(){
        var maxW=220, scale=Math.min(1,maxW/img.width);
        var w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        var dataUrl = c.toDataURL("image/jpeg",0.6);
        URL.revokeObjectURL(url); resolve(dataUrl);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  // ---------- Gemini API ----------
  async function callGemini(parts, opts){
    opts = opts || {};
    if(!state.apiKey){ throw {code:"no_key", message:"no key"}; }
    var model = opts.model || activeModel();
    var url = "https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(state.apiKey);
    var genConfig = {};
    if(opts.maxOutputTokens) genConfig.maxOutputTokens = opts.maxOutputTokens;
    if(opts.json) genConfig.responseMimeType = "application/json";
    var body = { contents: opts.contents || [{ role:"user", parts: parts }], generationConfig: genConfig };
    if(opts.systemInstruction) body.systemInstruction = { parts:[{text:opts.systemInstruction}] };
    var resp;
    try{ resp = await fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body) }); }
    catch(e){ throw {code:"network", message:String(e && e.message || e)}; }
    var json = await resp.json().catch(function(){ return null; });
    if(!resp.ok){
      var msg = (json && json.error && json.error.message) || ("HTTP "+resp.status);
      var code = (json && json.error && json.error.status) || ("http_"+resp.status);
      throw {code:code, message:msg};
    }
    var cand = json && json.candidates && json.candidates[0];
    if(!cand){ throw {code:"empty", message:"No response — the request may have been blocked."}; }
    if(cand.finishReason==="SAFETY" || cand.finishReason==="RECITATION"){
      throw {code:"refused", message:"Gemini declined this request (reason: "+cand.finishReason+")."};
    }
    var text = ((cand.content && cand.content.parts) || []).map(function(p){ return p.text||""; }).join("");
    if(!text){ throw {code:"empty", message:"Empty response. Try again with less at once."}; }
    return text;
  }
  function extractJson(text){
    try{ return JSON.parse(text); }catch(e){}
    var a=text.indexOf("{"), b=text.lastIndexOf("}");
    if(a>=0 && b>a){ try{ return JSON.parse(text.slice(a,b+1)); }catch(e){} }
    throw new Error("Couldn't read the reply as structured data.");
  }
  function apiErrorCopy(e){
    if(!e) return "Something went wrong. Try again.";
    if(e.code==="no_key") return "Add your free Gemini API key in Settings first.";
    if(e.code==="network") return "Couldn't reach Google's servers — check your internet connection.";
    if(e.code==="UNAUTHENTICATED" || e.code==="PERMISSION_DENIED" || e.code==="http_401" || e.code==="http_403") return "That API key was rejected. Double-check it in Settings.";
    if(e.code==="RESOURCE_EXHAUSTED" || e.code==="http_429") return "You've hit the free tier's rate limit for now — wait a bit and try again.";
    if(e.code==="refused") return e.message;
    if(e.code==="empty") return e.message || "No answer came back. Try again.";
    return "Something went wrong (" + (e.message||"unknown") + "). Try again.";
  }

    async function sendChat(){
      var text = inputEl.value.trim();

      }
      errBox.innerHTML = "";

      sendBtn.disabled = true; inputEl.disabled = true;
      try{

  async function analyzeOmissionFile(file, sName){
    var basePrompt = "This file is a teacher's exam omission/extra-focus note or a textbook page for an ICSE Class 9 student, subject: "+sName+". "+
      "Identify exactly which chapters, headings or sections are marked as OMITTED (not to be tested), and any marked as EXTRA FOCUS. "+
      "Output short plain-text dash-prefixed lines only, e.g. '- Omit: <heading>' or '- Extra focus: <topic>'. No other commentary.";
    var lowerName = file.name.toLowerCase();
    if(file.type === "application/pdf"){
      var b64 = await fileToBase64(file);
      return callGemini([{inline_data:{mime_type:"application/pdf", data:b64}}, {text:basePrompt}], { maxOutputTokens:800 });
    }else if(file.type.indexOf("image/")===0){
      var b64i = await fileToBase64(file);
      return callGemini([{inline_data:{mime_type:file.type, data:b64i}}, {text:basePrompt}], { maxOutputTokens:800 });
    }else if(lowerName.endsWith(".docx")){
      var buf = await file.arrayBuffer();
      var result = await window.mammoth.extractRawText({ arrayBuffer: buf });
      var docText = (result.value||"").trim().slice(0,20000);
      if(!docText) throw new Error("Couldn't find any text in that Word document.");
      return callGemini([{text: basePrompt + "\n\nExtracted text:\n\n" + docText}], { maxOutputTokens:800 });
    }else if(lowerName.endsWith(".txt") || file.type==="text/plain"){
      var raw = (await file.text()).slice(0,20000);
      return callGemini([{text: basePrompt + "\n\nText:\n\n" + raw}], { maxOutputTokens:800 });
    }
    throw new Error("Unsupported file type. Use a PDF, photo, .docx or .txt file.");
  }

  function materialsSummaryFor(slug){
    var items = state.materials.filter(function(m){ return m.subjectSlug===slug && m.status==="done" && m.summary; })
      .sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); })
      .slice(0, 25);
    return items.map(function(m){ return "["+(m.kind==="mock"?"Mock paper":"Material")+": "+m.fileName+"]\n"+m.summary; }).join("\n\n").slice(0,8000);
  }

  function materialsSummaryAllSubjects(){

      var s = materialsSummaryFor(slug);
      if(s) chunks.push("Subject: " + state.subjects[slug].name + "\n" + s.slice(0,1200));

  // ---- Export a generated paper as PDF / Word / Image, and share it ----

  function paperWatermarkText(){

  function paperSheetHtml(p){

  function paperFileName(p, ext){
    var safe = (p.subjectName||"paper").replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/^-+|-+$/g,"") || "paper";
    var tag = p.id ? String(p.id).slice(-6) : String(Date.now()).slice(-6);
    return "studyio-"+safe+"-"+tag+"."+ext;

  function downloadBlob(blob, filename){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }
  // Renders a paper as an offscreen, fully-styled .paper-sheet (same look as
  // on-screen) at a fixed width, so exports look consistent regardless of the
  // viewer's window size. Returns a <canvas> via html2canvas.
  async function renderPaperSheetCanvas(p){
    if(!window.html2canvas) throw new Error("Export needs an internet connection the first time (to load a small helper library) — check your connection and try again.");
    var host = document.createElement("div");
    host.style.position = "fixed"; host.style.left = "-99999px"; host.style.top = "0"; host.style.width = "760px";
    host.innerHTML = paperSheetHtml(p);
    document.body.appendChild(host);
    try{
      return await window.html2canvas(host.firstElementChild, { scale:2, backgroundColor:"#ffffff", useCORS:true });
    } finally { host.remove(); }
  }
  async function exportPaperAsImage(p){
    var canvas = await renderPaperSheetCanvas(p);
    var blob = await new Promise(function(res){ canvas.toBlob(res, "image/png"); });
    downloadBlob(blob, paperFileName(p, "png"));
  }
  async function buildPaperPdfBlob(p){
    if(!window.jspdf) throw new Error("Export needs an internet connection the first time (to load a small helper library) — check your connection and try again.");
    var canvas = await renderPaperSheetCanvas(p);
    var pdf = new window.jspdf.jsPDF({ unit:"pt", format:"a4" });
    var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    var imgW = pageW, imgH = canvas.height * (imgW / canvas.width);
    var imgData = canvas.toDataURL("image/png");
    if(imgH <= pageH){
      pdf.addImage(imgData, "PNG", 0, 0, imgW, imgH);
    }else{
      var heightLeft = imgH, position = 0;
      while(heightLeft > 0){
        pdf.addImage(imgData, "PNG", 0, position, imgW, imgH);
        heightLeft -= pageH; position -= pageH;
        if(heightLeft > 0) pdf.addPage();
      }
    }
    return pdf;
  }
  async function exportPaperAsPDF(p){
    var pdf = await buildPaperPdfBlob(p);
    pdf.save(paperFileName(p, "pdf"));
  }
  async function exportPaperAsWord(p){
    if(!window.docx) throw new Error("Export needs an internet connection the first time (to load a small helper library) — check your connection and try again.");
    var D = window.docx;
    var children = [
      new D.Paragraph({ text: p.subjectName, heading: D.HeadingLevel.HEADING_1 }),
      new D.Paragraph({ text: "Total marks: "+p.marksTotal+"   Time: "+p.timeMinutes+" min   Difficulty: "+(p.difficulty||""), spacing:{ after:240 } })
    ];
    (String(p.content||"").split("\n")).forEach(function(line){
      children.push(new D.Paragraph({ text: line }));
    });
    var watermarkRun = new D.TextRun({ text: paperWatermarkText(), color:"CCCCCC", size:16 });
    var footRun = new D.TextRun({ text: "Generated with Studyio", color:"AAAAAA", size:14 });
    var doc = new D.Document({ sections:[{
      properties:{},
      headers:{ default: new D.Header({ children:[ new D.Paragraph({ alignment: D.AlignmentType.CENTER, children:[watermarkRun] }) ] }) },
      footers:{ default: new D.Footer({ children:[ new D.Paragraph({ alignment: D.AlignmentType.CENTER, children:[footRun] }) ] }) },
      children: children
    }] });
    var blob = await D.Packer.toBlob(doc);
    downloadBlob(blob, paperFileName(p, "docx"));
  }
  // Shares a paper directly via the OS share sheet when available (Web Share
  // API — mobile Chrome/Safari and some desktop browsers), falling back to
  // copying the paper text to the clipboard everywhere else. Returns a status
  // string to show the user on the fallback path; resolves silently on a real
  // native share (the OS shows its own UI).
  async function sharePaper(p){
    var pdfBlob = null;
    try{ var pdf = await buildPaperPdfBlob(p); pdfBlob = pdf.output("blob"); }catch(e){ pdfBlob = null; }
    if(navigator.share){
      if(pdfBlob){
        var file = new File([pdfBlob], paperFileName(p,"pdf"), { type:"application/pdf" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          await navigator.share({ files:[file], title: p.subjectName+" — practice paper", text:"Practice paper from Studyio" });
          return;
        }
      }
      await navigator.share({ title: p.subjectName+" — practice paper", text: (p.subjectName+" practice paper ("+p.marksTotal+" marks)\n\n"+(p.content||"")).slice(0,4000) });
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(p.content||"");
      return "Copied the paper text to your clipboard — paste it anywhere to share.";
    }
    throw new Error("Sharing isn't supported in this browser. Use Export instead.");
  }
  function buildExportToolbar(getPaper){
    var bar = el(
      '<div class="paper-toolbar">'+
        '<label class="fmt-check"><input type="checkbox" value="pdf" checked>PDF</label>'+
        '<label class="fmt-check"><input type="checkbox" value="word">Word</label>'+
        '<label class="fmt-check"><input type="checkbox" value="image">Image</label>'+
        '<button type="button" class="btn secondary">Export</button>'+
        '<button type="button" class="linkbtn">Share</button>'+
        '<span class="paper-export-status"></span>'+
      '</div>'
    );
    var exportBtn = bar.querySelector(".btn");
    var shareBtn = bar.querySelector(".linkbtn");
    var statusEl = bar.querySelector(".paper-export-status");
    exportBtn.addEventListener("click", async function(){
      var fmts = Array.from(bar.querySelectorAll("input:checked")).map(function(c){ return c.value; });
      if(!fmts.length){ statusEl.textContent = "Pick at least one format."; return; }
      exportBtn.disabled = true;
      try{
        var p = getPaper();
        for(var i=0;i<fmts.length;i++){
          statusEl.textContent = "Preparing "+fmts[i].toUpperCase()+"…";
          if(fmts[i]==="pdf") await exportPaperAsPDF(p);
          else if(fmts[i]==="word") await exportPaperAsWord(p);
          else if(fmts[i]==="image") await exportPaperAsImage(p);
        }
        statusEl.textContent = "Downloaded.";

        '</select></div>';
      document.getElementById("m-textbook-select").addEventListener("change", function(){

      '<div class="chapters-box" id="m-chapters"></div>'+
      (isFixedTextbook ?
        '<p style="color:var(--ink-soft);font-size:12px;margin:6px 0 0;">Chapter names come fixed from &ldquo;'+esc(s.textbook)+'&rdquo; and can\'t be renamed — switch textbook above if this isn\'t the right edition.</p>'
        : ((s.chapters && s.chapters.length) ? '<p style="color:var(--ink-soft);font-size:12px;margin:-2px 0 10px;">Click a chapter’s name to rename it.</p>' : ''))+
      (!isFixedTextbook ?
        '<div class="row" style="align-items:flex-end;margin-top:8px;">'+
          '<div class="field" style="margin-bottom:0;"><input type="text" id="m-newchapter" placeholder="Add a chapter name"></div>'+
          '<button class="btn small" id="m-addchapter">Add</button>'+
        '</div>' : '')+
      '</div>'
    );
    main.appendChild(chPanel);

    function renderChapterList(filterText){
      var box = chPanel.querySelector("#m-chapters");
      var q = (filterText||"").trim().toLowerCase();
      var list = (s.chapters||[]).map(function(c,i){ return {c:c, i:i}; });
      if(q){
        list = list.filter(function(item){
          var num = String(item.i+1);
          return num===q || item.c.toLowerCase().indexOf(q)!==-1 || (num+".").indexOf(q)===0 || ("chapter "+num).indexOf(q)!==-1;
        });
      }
      if(list.length===0){
        box.innerHTML = q ? '<span style="font-size:13px;color:var(--ink-soft)">No chapter matches &ldquo;'+esc(filterText)+'&rdquo;.</span>' : '';
      } else {
        box.innerHTML = list.map(function(item){
          var numLabel = isFixedTextbook ? '<span style="opacity:.55;font-size:11.5px;margin-right:3px;">'+(item.i+1)+'.</span>' : '';
          var nameHtml = isFixedTextbook
            ? '<span class="chap-text">'+numLabel+esc(item.c)+'</span>'
            : '<span class="chap-text" data-i="'+item.i+'" title="Click to rename" style="cursor:text;">'+esc(item.c)+'</span>';
          return '<span class="chapter-chip checked" data-i="'+item.i+'">'+nameHtml+
            ' <button type="button" class="linkbtn rm-chapter" data-i="'+item.i+'" style="margin-left:2px;">&times;</button></span>';
        }).join("");
      }
      box.querySelectorAll(".rm-chapter").forEach(function(btn){
        btn.addEventListener("click", function(){
          var i = parseInt(btn.getAttribute("data-i"),10);
          s.chapters.splice(i,1); saveState(); render();
        });
      });
      if(!isFixedTextbook){
        box.querySelectorAll(".chap-text").forEach(function(span){
          span.addEventListener("click", function(){
            var i = parseInt(span.getAttribute("data-i"),10);
            var input = document.createElement("input");
            input.type = "text"; input.value = s.chapters[i];
            input.style.cssText = "font-size:13px;padding:2px 6px;border:1px solid var(--focus);border-radius:4px;width:"+Math.max(80,s.chapters[i].length*7)+"px;background:var(--surface);color:var(--ink);";
            span.replaceWith(input);
            input.focus(); input.select();
            var done = false;
            function commit(){
              if(done) return; done = true;
              var v = input.value.trim();
              if(v) s.chapters[i] = v;
              saveState(); render();
            }
            input.addEventListener("blur", commit);
            input.addEventListener("keydown", function(ev){
              if(ev.key==="Enter"){ ev.preventDefault(); commit(); }
              else if(ev.key==="Escape"){ ev.preventDefault(); if(!done){ done=true; render(); } }
            });
          });
        });
      }
    }
    renderChapterList("");
    if(isFixedTextbook){
      document.getElementById("m-chapter-search").addEventListener("input", function(){
        renderChapterList(this.value);
      });
    }
    if(!isFixedTextbook){
      document.getElementById("m-addchapter").addEventListener("click", function(){
        var input = document.getElementById("m-newchapter");
        var v = input.value.trim(); if(!v) return;
        s.chapters.push(v); saveState(); render();

    main.appendChild(uploadSection(slug, "material", "Study materials", "Notes, textbook excerpts, syllabus, teacher handouts…"));
    main.appendChild(uploadSection(slug, "mock", "Mock papers", "Full past tests or mock exams — upload as many as you have."));
  }

        (items.length ? items.map(materialRowHtml).join("") : '<div class="empty" style="padding:8px 0;">Nothing uploaded yet.</div>')+
      '</div></div>'
    );

  async function handleMaterialUpload(input, slug, kind){
    var file = input.files[0]; if(!file) return;
    var thumb = await makeThumbnail(file);
    var mat = { id:uid(), subjectSlug:slug, kind:kind, fileName:file.name, fileType:file.type||"file",
      status:"pending", summary:"", thumb:thumb, createdAt:new Date().toISOString() };
    state.materials.unshift(mat); saveState(); render();

    var sName = subjectName(slug);
    var basePrompt = "This is "+(kind==="mock" ? "a full past mock exam/test paper" : "study material")+" for an ICSE Class 9 student, subject: "+sName+". "+
      "Extract concise plain-text notes for future reference: section structure and mark distribution (if it's a paper), exact phrasing and command words used, topics/questions/content covered, and any marking-scheme hints visible. "+
      "Output 5-10 short dash-prefixed lines, plain text only, no other commentary.";
    try{
      var text;
      var lowerName = file.name.toLowerCase();
      if(file.type === "application/pdf"){
        var b64 = await fileToBase64(file);
        text = await callGemini([{inline_data:{mime_type:"application/pdf", data:b64}}, {text:basePrompt}], { maxOutputTokens:1200 });
      }else if(file.type.indexOf("image/")===0){
        var b64i = await fileToBase64(file);
        text = await callGemini([{inline_data:{mime_type:file.type, data:b64i}}, {text:basePrompt}], { maxOutputTokens:1200 });
      }else if(lowerName.endsWith(".docx")){
        var buf = await file.arrayBuffer();
        var result = await window.mammoth.extractRawText({ arrayBuffer: buf });
        var docText = (result.value||"").trim().slice(0,20000);
        if(!docText) throw new Error("Couldn't find any text in that Word document.");
        text = await callGemini([{text: basePrompt + "\n\nExtracted text:\n\n" + docText}], { maxOutputTokens:1200 });
      }else if(lowerName.endsWith(".txt") || file.type==="text/plain"){
        var raw = (await file.text()).slice(0,20000);
        text = await callGemini([{text: basePrompt + "\n\nText:\n\n" + raw}], { maxOutputTokens:1200 });
      }else{
        throw new Error("Unsupported file type here — use a PDF, photo (jpg/png), .docx or .txt file.");
      }
      mat.status = "done"; mat.summary = text;
    }catch(e){
      mat.status = "failed"; mat.summary = e && e.code ? apiErrorCopy(e) : (e.message || String(e));
    }
    saveState();
    if(tab==="material") render();
  }

  function renderCheckPanel(main){

      '<div class="uploadbox" id="chk-uploadbox">Click to choose file(s)</div>'+

    var subjectSel = panel.querySelector("#chk-subject");
    var paperSel = panel.querySelector("#chk-paper");
    function refreshPapers(){
      var ps = state.papers.filter(function(p){ return p.subjectSlug===subjectSel.value; })
        .sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
      paperSel.innerHTML = '<option value="">Not from this app / external test</option>' + ps.map(function(p){
        return '<option value="'+esc(p.id)+'">'+esc(fmtDate(p.createdAt))+' &middot; '+esc(p.marksTotal)+' marks'+(p.chapters&&p.chapters.length?" — "+esc(p.chapters.join(", ").slice(0,40)):"")+'</option>';
      }).join("");
    }
    refreshPapers();
    subjectSel.addEventListener("change", refreshPapers);

    var chosenFiles = [];
    panel.querySelector("#chk-uploadbox").addEventListener("click", function(){ panel.querySelector("#chk-file").click(); });
    panel.querySelector("#chk-file").addEventListener("change", function(){
      chosenFiles = Array.from(this.files || []);
      panel.querySelector("#chk-filename").textContent = chosenFiles.length ? ("Attached: "+chosenFiles.map(function(f){return f.name;}).join(", ")) : "";
    });

    panel.querySelector("#chk-btn").addEventListener("click", async function(){
      var btn = this;
      var slug = subjectSel.value, sName = subjectName(slug);
      var paper = state.papers.find(function(p){ return p.id===paperSel.value; });
      var answersText = panel.querySelector("#chk-answers").value.trim();
      var status = panel.querySelector("#chk-status"), out = panel.querySelector("#chk-output");
      status.innerHTML=""; out.innerHTML="";
      if(!answersText && chosenFiles.length===0){ status.appendChild(el('<div class="notice err">Type your answers or attach a file first.</div>')); return; }
      btn.disabled = true;
      out.appendChild(el('<div class="empty thinking">Marking your script&hellip; this can take a minute.</div>'));

      var promptText =
        "You are grading an ICSE Class 9 student's answers the way a real ICSE examiner would: award marks for correct keywords, working/steps and structure, not just right/wrong; deduct for missing units, unlabelled diagrams, skipped working, or answers longer/shorter than their mark value deserves.\n\n"+
        "SUBJECT: "+sName+"\n\nTHE PAPER"+(paper?"":" (none selected — if the attached file(s) contain the questions too, grade from those; otherwise grade the answers generally)")+":\n"+(paper?paper.content:"(not provided)")+"\n\n"+
        "THE STUDENT'S ANSWERS"+(chosenFiles.length?" (also see the attached file(s), possibly multiple pages of one script)":"")+":\n"+(answersText||"(see attached file(s))")+"\n\n"+
        "Reply with ONLY a JSON object, this exact shape, no other text:\n"+
        '{"totalScore": number, "maxScore": number, "questions": [{"qNo": "1(a)", "max": 2, "awarded": 1.5, "pointer": "one specific, practical sentence on exactly what to change to earn full marks"}], "generalPointers": ["2-4 specific, practical sentences"], "practicalAdvice": ["2-4 sentences of concrete, applicable exam-technique advice — never generic advice like ‘study more’ or ‘practice regularly’; say exactly what habit or technique to change"]}\n'+
        "Be honest and specific, never generically encouraging, and never vague (\"study more\", \"revise better\" are not acceptable pointers — always say exactly what to do differently). Base marks strictly on ICSE Class 9 marking-scheme conventions.";

      try{
        var parts = [];
        for(var i=0;i<chosenFiles.length;i++){
          var f = chosenFiles[i];
          var b64 = await fileToBase64(f);
          parts.push({ inline_data:{ mime_type: f.type || "application/pdf", data:b64 } });
        }
        parts.push({ text: promptText });
        var text = await callGemini(parts, { maxOutputTokens:4000, json:true });

          totalScore:data.totalScore, maxScore:data.maxScore, questions:data.questions||[],
          generalPointers:data.generalPointers||[], practicalAdvice:data.practicalAdvice||[], createdAt:new Date().toISOString() });
        saveState();
      }catch(e){
        out.innerHTML = "";
        status.appendChild(el('<div class="notice err">'+esc(apiErrorCopy(e))+'</div>'));
      }finally{ btn.disabled = false; }
    });

  function renderProgressChart(container){
    var bySubject = {};
    state.results.forEach(function(r){
      if(!r.maxScore) return;
      var pct = Math.max(0, Math.min(100, (r.totalScore/r.maxScore)*100));
      (bySubject[r.subjectSlug] = bySubject[r.subjectSlug] || []).push({ t:new Date(r.createdAt).getTime(), pct:pct, date:r.createdAt });
    });
    var slugs = Object.keys(bySubject);
    if(slugs.length===0){ container.appendChild(el('<div class="panel"><div class="empty">Check a few papers to see your progress here.</div></div>')); return; }
    slugs.forEach(function(k){ bySubject[k].sort(function(a,b){ return a.t-b.t; }); });
    var allTimes = state.results.map(function(r){ return new Date(r.createdAt).getTime(); });
    var minT = Math.min.apply(null, allTimes), maxT = Math.max.apply(null, allTimes);
    if(minT===maxT){ minT -= 86400000; maxT += 86400000; }
    var W=640, H=300, padL=38, padR=16, padT=16, padB=30;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function x(t){ return padL + (t-minT)/(maxT-minT)*plotW; }
    function y(pct){ return padT + (1-pct/100)*plotH; }
    var palette = ["#ab301c","#1f4235","#c9a227","#3b6ea5","#7a3b8f","#0e7a6b","#b3541f","#5a5a5a","#c94f8f"];
    var parts = [];
    [0,25,50,75,100].forEach(function(g){
      var gy = y(g);
      parts.push('<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1" />');
      parts.push('<text x="'+(padL-6)+'" y="'+(gy+4)+'" font-size="10" text-anchor="end" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+g+'</text>');
    });
    slugs.forEach(function(s,i){
      var color = palette[i % palette.length];
      var pts = bySubject[s];
      var d = pts.map(function(p,idx){ return (idx===0?"M":"L")+x(p.t).toFixed(1)+","+y(p.pct).toFixed(1); }).join(" ");
      parts.push('<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />');
      pts.forEach(function(p){
        parts.push('<circle cx="'+x(p.t).toFixed(1)+'" cy="'+y(p.pct).toFixed(1)+'" r="3.5" fill="'+color+'"><title>'+esc(subjectName(s))+': '+Math.round(p.pct)+'% on '+esc(fmtDate(p.date))+'</title></circle>');
      });
    });
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" role="img" aria-label="Score progress over time by subject">'+parts.join("")+'</svg>';
    var legend = '<div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;">'+slugs.map(function(s,i){
      return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;"><span style="width:10px;height:10px;border-radius:50%;background:'+palette[i%palette.length]+';display:inline-block;"></span>'+esc(subjectName(s))+'</span>';
    }).join("")+'</div>';
    container.appendChild(el('<div class="panel">'+svg+legend+'</div>'));
  }

  // ================= PLANNER (coming later) =================
  function chapterStatus(slug, chapterName){
    var s = state.subjects[slug];
    return (s && s.chapterStatus && s.chapterStatus[chapterName]) || "pending";
  }
  function setChapterStatus(slug, chapterName, status){
    var s = state.subjects[slug];
    if(!s) return;
    if(!s.chapterStatus) s.chapterStatus = {};
    s.chapterStatus[chapterName] = status;
  }
  function subjectAvgPct(slug){
    var rs = state.results.filter(function(r){ return r.subjectSlug===slug && r.maxScore; });
    if(rs.length===0) return null;
    var sum = rs.reduce(function(a,r){ return a + (r.totalScore/r.maxScore)*100; }, 0);
    return Math.round(sum/rs.length);
  }

  function renderTimetablePanel(main){
    var panel = el('<div class="panel"><h3 class="section-h">Weekly timetable</h3><p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;margin-bottom:12px;">Tick which subjects have a class on each day — this helps the plan avoid piling revision onto a day already full of fresh classes.</p></div>');
    DAYS.forEach(function(d){
      var checked = state.timetable[d[0]] || [];
      var row = el('<div style="margin-bottom:10px;"><label style="margin-bottom:4px;">'+d[1]+'</label><div class="chapters-box"></div></div>');
      var box = row.querySelector(".chapters-box");
      sortedSubjects().forEach(function(sub){
        var isOn = checked.indexOf(sub.slug)!==-1;
        var chip = el('<label class="chapter-chip'+(isOn?" checked":"")+'"><input type="checkbox" value="'+esc(sub.slug)+'"'+(isOn?" checked":"")+'><span>'+esc(sub.name)+'</span></label>');
        chip.querySelector("input").addEventListener("change", function(){
          var list = state.timetable[d[0]] || [];
          var idx = list.indexOf(sub.slug);
          if(this.checked && idx===-1) list.push(sub.slug);
          else if(!this.checked && idx!==-1) list.splice(idx,1);
          state.timetable[d[0]] = list;
          chip.classList.toggle("checked", this.checked);
          saveState();
        });
        box.appendChild(chip);
      });
      panel.appendChild(row);
    });
    main.appendChild(panel);
  }

    refreshChapterChips();

    function renderHistory(){

  function renderChapterProgressPanel(main){
    var panel = el('<div class="panel"><h3 class="section-h">Chapter progress</h3><p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;margin-bottom:6px;">Click a status to change it — useful for marking something &ldquo;Revised&rdquo; or &ldquo;Mastered&rdquo; after you’ve studied it yourself.</p></div>');

        '</div></div>');

  function renderPlanGenerator(main){
    var panel = el(
      '<div class="panel"><h3 class="section-h">Generate my plan</h3>'+
      '<div class="field"><label for="plan-days">Plan for the next</label><select id="plan-days">'+
        [["3","3 days"],["7","7 days"],["14","14 days"]].map(function(o){ return '<option value="'+o[0]+'">'+o[1]+'</option>'; }).join("")+
      '</select></div>'+
      '<button class="btn" id="plan-gen-btn">Generate plan</button>'+
      '<div id="plan-status"></div><div id="plan-output"></div></div>'
    );
    main.appendChild(panel);

    function renderPlan(){
      var out = panel.querySelector("#plan-output");
      out.innerHTML = "";
      if(!state.studyPlan || !state.studyPlan.days) return;
      out.appendChild(el('<h4 style="font-size:13px;color:var(--ink-soft);margin:16px 0 10px;">Generated '+esc(fmtDate(state.studyPlan.generatedAt))+'</h4>'));
      state.studyPlan.days.forEach(function(day, di){
        var dayBlock = el('<div class="panel" style="margin-bottom:10px;"><strong>'+esc(day.dayLabel||"")+' · '+esc(fmtDate(day.date))+'</strong></div>');
        (day.items||[]).forEach(function(item, ii){
          var row = el(
            '<div class="qrow"><div class="circle-mark" style="width:28px;height:28px;transform:none;"><input type="checkbox" style="width:16px;height:16px;" '+(item.done?"checked":"")+'></div>'+
            '<div class="qbody"><div class="qno">'+esc(item.subjectName||"")+' · '+esc(item.chapter||"")+' · '+esc(item.minutes||"")+' min</div>'+
            '<div class="pointer" style="'+(item.done?"text-decoration:line-through;color:var(--ink-soft);":"")+'">'+esc(item.task||"")+'</div></div></div>'
          );
          row.querySelector("input").addEventListener("change", function(){
            state.studyPlan.days[di].items[ii].done = this.checked;
            saveState(); renderPlan();
          });
          dayBlock.appendChild(row);
        });
        out.appendChild(dayBlock);
      });
    }
    renderPlan();

    panel.querySelector("#plan-gen-btn").addEventListener("click", async function(){
      var btn = this;
      var status = panel.querySelector("#plan-status");
      status.innerHTML = "";
      var nDays = parseInt(panel.querySelector("#plan-days").value,10) || 7;
      btn.disabled = true;
      panel.querySelector("#plan-output").innerHTML = "";
      panel.querySelector("#plan-output").appendChild(el('<div class="empty thinking">Building your plan&hellip;</div>'));

      var todayIso = new Date().toISOString().slice(0,10);
      var timetableText = DAYS.map(function(d){
        var subs = (state.timetable[d[0]]||[]).map(subjectName);
        return d[1]+": "+(subs.length?subs.join(", "):"no classes listed");
      }).join("\n");
      var progressText = sortedSubjects().map(function(s){
        if(!s.chapters || s.chapters.length===0) return null;
        var avg = subjectAvgPct(s.slug);
        var chaps = s.chapters.map(function(c){ return c+" ["+chapterStatus(s.slug,c)+"]"; }).join(", ");
        return s.name+(avg!==null?" (avg score "+avg+"%)":"")+": "+chaps;
      }).filter(Boolean).join("\n");
      var examText = Object.keys(state.examDates).map(function(slug){ return subjectName(slug)+": "+state.examDates[slug]; }).join("\n") || "(none set)";
      var recentLogsText = state.dailyLogs.slice(0,10).map(function(l){ return l.date+" "+subjectName(l.subjectSlug)+": "+(l.chapters||[]).join(", ")+(l.note?" — "+l.note:""); }).join("\n") || "(none yet)";

      var prompt =
        "You are building a personalized day-by-day home-study plan for an ICSE Class 9 student, starting "+todayIso+", for the next "+nDays+" days.\n\n"+
        "Weekly school timetable (subjects with class each day):\n"+timetableText+"\n\n"+
        "Chapter progress per subject, with status in brackets (pending = not covered/started, covered = taught in class but not revised, revised = studied once, mastered = confident) and recent average score on checked practice papers where available:\n"+progressText+"\n\n"+
        "Upcoming exam dates:\n"+examText+"\n\n"+
        "Recent daily check-ins (what's freshly been taught):\n"+recentLogsText+"\n\n"+
        "Build the plan: for each of the next "+nDays+" days, list 2-4 concrete, specific study tasks (never vague like ‘study math’ — say exactly what to do, e.g. ‘Revise Compound Interest formulas, then solve 10 practice problems’), each sized around 20-45 minutes, realistic for a school student's evening. Prioritize: chapters still pending or covered-but-not-revised, subjects with lower average scores, and chapters whose subject has a nearer exam date. Don't overload a day that already has many fresh classes in the timetable. Spread subjects out rather than repeating the same one every day unless it genuinely needs it.\n\n"+
        "Reply with ONLY JSON, this exact shape:\n"+
        '{"days":[{"date":"YYYY-MM-DD","dayLabel":"Monday","items":[{"subjectSlug":"mathematics","subjectName":"Mathematics","chapter":"Compound Interest","task":"specific actionable task","minutes":30}]}]}';

      try{
        var text = await callGemini([{text:prompt}], { maxOutputTokens:4000, json:true });
        var data = extractJson(text);
        state.studyPlan = { generatedAt: new Date().toISOString(), days: data.days || [] };
        saveState();
        renderPlan();
      }catch(e){
        panel.querySelector("#plan-output").innerHTML = "";
        status.appendChild(el('<div class="notice err">'+esc(apiErrorCopy(e))+'</div>'));
        renderPlan();
      }finally{ btn.disabled = false; }
    });
  }

    main.appendChild(apiPanel);
    document.getElementById("set-model").addEventListener("change", function(){
      document.getElementById("set-custom-wrap").style.display = this.value==="custom" ? "" : "none";
    });
    document.getElementById("set-save").addEventListener("click", function(){
      state.apiKey = document.getElementById("set-key").value.trim();
      state.model = document.getElementById("set-model").value;
      state.customModel = document.getElementById("set-custom") ? document.getElementById("set-custom").value.trim() : "";
      saveState();
      document.getElementById("set-saved").textContent = "Saved.";
      setTimeout(function(){ var el2 = document.getElementById("set-saved"); if(el2) el2.textContent=""; }, 1800);
    });

    var subjPanel = el(
      '<div class="panel"><h3 class="section-h">Add a subject</h3>'+
      '<div class="row" style="align-items:flex-end">'+
        '<div class="field" style="margin-bottom:0"><input id="lib-newsubject" type="text" placeholder="e.g. Computer Applications"></div>'+
        '<button class="btn small" id="lib-add-btn">Add</button>'+
      '</div><p style="color:var(--ink-soft);font-size:12.5px;margin-top:10px;">Manage chapters, materials and mock papers for a subject from the Material tab.</p></div>'
    );
    main.appendChild(subjPanel);
    document.getElementById("lib-add-btn").addEventListener("click", function(){
      var input = document.getElementById("lib-newsubject");
      var name = input.value.trim(); if(!name) return;
      var slug = slugify(name);
      state.subjects[slug] = { slug:slug, name:name, chapters:[] };
      saveState(); input.value=""; render();
    });

    var themePanel = el(
      '<div class="panel"><h3 class="section-h">Theme</h3>'+
      '<p style="color:var(--ink-soft);font-size:12.5px;margin-top:-4px;margin-bottom:12px;">'+
      '&ldquo;Chatbot Light&rdquo; is the default — a clean, minimal look like a typical AI chat app. &ldquo;Enchanted Academy&rdquo; and &ldquo;Six Gems&rdquo; are original looks (candlelit-parchment, and a starfield with a colourful six-hue accent motif) — inspired by cozy/epic aesthetics in general, not any specific book, film or comic&rsquo;s characters, names or branding. &ldquo;Custom Colour&rdquo; lets you pick your own accent colour on a fixed light layout.</p>'+
      '<div class="row" id="theme-row">'+
        THEMES.map(function(t){ return '<label class="diff-opt'+(state.theme===t[0]?" checked":"")+'" style="flex:1;min-width:150px;"><input type="radio" name="theme" value="'+t[0]+'"'+(state.theme===t[0]?" checked":"")+'>'+esc(t[1])+'</label>'; }).join("")+
      '</div>'+
      '<div id="custom-accent-wrap" style="'+(state.theme==="custom"?"margin-top:16px;":"display:none;margin-top:16px;")+'">'+
        '<label>Pick your accent colour</label>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
          CUSTOM_ACCENT_PRESETS.map(function(hex){
            return '<button type="button" class="accent-swatch" data-hex="'+hex+'" style="width:30px;height:30px;border-radius:50%;border:2px solid '+(state.customAccent===hex?"var(--ink)":"transparent")+';background:'+hex+';cursor:pointer;padding:0;"></button>';
          }).join("")+
          '<input type="color" id="custom-accent-picker" value="'+esc(state.customAccent||CUSTOM_ACCENT_PRESETS[0])+'" style="width:38px;height:30px;padding:0;border:1px solid var(--border);border-radius:6px;cursor:pointer;">'+
        '</div>'+
      '</div>'+
      '</div>'
    );
    main.appendChild(themePanel);
    function refreshAccentSwatches(){
      themePanel.querySelectorAll(".accent-swatch").forEach(function(sw){
        sw.style.borderColor = (sw.getAttribute("data-hex")===state.customAccent) ? "var(--ink)" : "transparent";
      });
    }
    function setCustomAccent(hex){
      state.customAccent = hex; saveState();
      document.getElementById("custom-accent-picker").value = hex;
      refreshAccentSwatches();
      if(state.theme==="custom") applyCustomAccent(hex);
    }
    themePanel.querySelectorAll('input[name="theme"]').forEach(function(radio){
      radio.addEventListener("change", function(){
        themePanel.querySelectorAll(".diff-opt").forEach(function(o){ o.classList.remove("checked"); });
        radio.closest(".diff-opt").classList.add("checked");
        state.theme = radio.value; saveState();
        document.documentElement.setAttribute("data-theme", state.theme);
        if(state.theme==="custom") applyCustomAccent(state.customAccent || CUSTOM_ACCENT_PRESETS[0]);
        else clearCustomAccentOverride();
        document.getElementById("custom-accent-wrap").style.display = state.theme==="custom" ? "" : "none";
      });
    });
    themePanel.querySelectorAll(".accent-swatch").forEach(function(sw){
      sw.addEventListener("click", function(){ setCustomAccent(sw.getAttribute("data-hex")); });
    });
    var pickerEl = document.getElementById("custom-accent-picker");
    if(pickerEl) pickerEl.addEventListener("input", function(){ setCustomAccent(this.value); });

    var syncPanel = el(
      '<div class="panel"><h3 class="section-h">Cross-device sync</h3>'+
      syncStatusHtml()+
      (FIREBASE_CONFIG ? (
        '<div class="field"><label for="set-synccode">Sync code</label><input id="set-synccode" type="text" placeholder="a phrase only you would use" value="'+esc(getSyncCode())+'"></div>'+
        '<button class="btn small" id="set-sync-connect">Use this code on this device</button>'+
        '<p style="color:var(--ink-soft);font-size:12.5px;margin-top:10px;">Type the exact same code on every device to keep them in sync.</p>'
      ) : (
        '<p style="color:var(--ink-soft);font-size:13.5px;">Not set up yet — data stays on this device only. See SETUP.md &ldquo;Cross-device sync&rdquo; for the one-time free Firebase setup.</p>'
      ))+
      '</div>'
    );
    main.appendChild(syncPanel);
    if(FIREBASE_CONFIG){
      document.getElementById("set-sync-connect").addEventListener("click", function(){
        var code = document.getElementById("set-synccode").value.trim();
        if(!code){ alert("Enter a sync code first."); return; }
        connectSync(code); render();
      });
    }

    var backup = el(
      '<div class="panel"><h3 class="section-h">Backup &amp; transfer</h3>'+
      '<p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;">Everything lives only in this browser unless synced. Export a backup before switching devices.</p>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
        '<button class="btn secondary" id="set-export">Export backup (.json)</button>'+
        '<button class="btn secondary" id="set-import-btn">Import backup</button>'+
        '<button class="btn danger" id="set-clear">Erase all data on this device</button>'+
      '</div><input type="file" id="set-import-file" accept="application/json" style="display:none"></div>'
    );
    main.appendChild(backup);
    document.getElementById("set-export").addEventListener("click", function(){
      var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "studyio-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a); a.click(); a.remove();
    });
    document.getElementById("set-import-btn").addEventListener("click", function(){ document.getElementById("set-import-file").click(); });
    document.getElementById("set-import-file").addEventListener("change", async function(){
      var file = this.files[0]; if(!file) return;
      try{
        var incoming = JSON.parse(await file.text());
        if(!incoming || typeof incoming!=="object") throw new Error("bad file");
        state = normalizeState(incoming);
        saveState(); alert("Backup imported."); render();
      }catch(e){ alert("That didn't look like a valid backup file."); }
    });
    document.getElementById("set-clear").addEventListener("click", async function(){
      if(!confirm("This erases every subject, paper, result and your API key. This can't be undone. Continue?")) return;
      var eraseCloudToo = syncDocRef ? confirm("You're synced to the cloud. Also erase the synced copy, so every device connected with this code clears too? (Cancel: only this device clears, and it will re-sync the old data back shortly.)") : false;
      localStorage.removeItem(storageKeyFor(activeProfileId));
      state = loadState();
      if(syncDocRef && eraseCloudToo){
        try{ await syncDocRef.set({ payload: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }catch(e){}
      }
      render();
    });
  }

  function syncStatusHtml(){
    var map = {
      disabled: ['pending', 'Local only on this device'],
      connecting: ['pending', 'Connecting&hellip;'],
      "no-code": ['pending', 'Enter a sync code below to start'],
      connected: ['done', 'Connected — syncing with any device using this code'],
      error: ['failed', 'Couldn’t connect — check your Firebase config and internet connection']
    };
    var m = map[syncStatus] || map.disabled;
    return '<span class="status-badge '+m[0]+'" style="margin-bottom:12px;display:inline-block;">'+m[1]+'</span>';
  }

  // ---------- boot ----------
  var isBrandNewInstall = false;
  try{ isBrandNewInstall = !localStorage.getItem(PROFILES_KEY) && !localStorage.getItem(STORAGE_KEY); }catch(e){}
  activeProfileId = getActiveProfileId();
  state = loadState();
  if(isBrandNewInstall){ needsProfileSetup = true; onboardingIsNewAccount = false; }
  render();
  document.getElementById("main").addEventListener("focusout", function(){
    if(pendingRerender){ pendingRerender = false; render(); }
  });
  initSync();
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("Service worker failed:", e); });
    });
  }
})();
</script>
</body>
</html>
